# rust-toolchain.toml —— 仓库级工具链约定
# 目的：本地与 CI 使用同一个编译器版本，杜绝「本机绿、云端红」。
#
# 为什么锁具体版本 1.96.0（不再写 "stable"）：
#   - 2026-11 的教训：CI runner 的 stable 前进到 1.99.0，本机仍是 1.96.0；
#     同一提交在本地 clippy 全绿，云端 check job 却被两个新 lint 拦下
#     （clippy::result_large_err、clippy::map_or_identity），v0.3.10 起全线变红。
#   - 固定版本后 clippy 的 lint 集合与 rustfmt 行为可复现；升级是显式动作，
#     需要改这里的版本号并在本地、CI 一起验证（见 docs/BUILD.md §2.3）。
#   - 1.96.0 是 v0.3.12 / v0.3.13 的发布工具链，产物与已验证二进制一致。
#
# 代价（实测，见 docs/BUILD.md §2.3）：首次在新机器 / CI runner 上会按版本号下载
# 该工具链与组件；本机已装 1.96.0，无额外开销。
#
# components 声明 rustfmt / clippy，确保门禁依赖的组件一定存在（缺失时 rustup 自动补装，
# 而不是在 cargo clippy 阶段才报 “no such command”）。
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-musl"]
