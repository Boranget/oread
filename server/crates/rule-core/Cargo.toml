[package]
name = "boranlib-rule-core"
version = "1.0.0"
edition = "2021"
description = "oread 书源引擎内核：HTTP 预算、规则解释器、书目结构体"

# 纪律（按依赖保证，不靠注释）：
# - 默认构建**不含 sqlx / axum**；只有开启 `sqlx-row` 才引入 FromRow 派生，
#   供服务端直接复用实体定义。查询、连接池、路由一律不许进本 crate。
# - 不读写 data_dir、不碰任何表。

[features]
default = []
# 仅为 `entities` 的 sqlx::FromRow 派生提供支持；不启用时引擎可独立编译与测试。
sqlx-row = ["dep:sqlx"]

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
boa_engine = "0.19"
cbc = { version = "0.1", features = ["alloc"] }
encoding_rs = "0.8"
futures = "0.3"
jsonpath-rust = "0.7"
md-5 = "0.10"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "rustls-tls", "stream"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sxd-document = "0.3"
sxd-xpath = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs", "io-util"] }
tracing = "0.1"
url = "2"

sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
