[package]
name = "boranlib"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "boranlib"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["fs", "cors", "compression-gzip"] }
futures = "0.3"
once_cell = "1"

# ---- 规则引擎 ----
scraper = "0.20"            # CSS 选择器 / JSoup 等价
jsonpath-rust = "0.7"       # JsonPath
sxd-xpath = "0.4"           # XPath（XML 响应）
sxd-document = "0.3"        # sxd-xpath 的 XML 文档模型
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "rustls-tls", "stream"] }
boa_engine = "0.19"         # JS 引擎（Rhino 等价，纯 Rust 便于交叉编译）
regex = "1"
url = "2"
encoding_rs = "0.8"         # 响应体解码：UTF-8 / GBK / GB18030 / Big5
base64 = "0.22"
# 图片解码/编码：仅开 WebP + JPEG（纯 Rust 实现，不含 libwebp 的 C 绑定，
# musl 交叉编译不需要 C 工具链）。用于把 WebP 漫画页在服务端转成 JPEG 供墨水屏显示。
image = { version = "0.25", default-features = false, features = ["webp", "jpeg"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[dev-dependencies]
# 路由冒烟测试用 oneshot 直接驱动 Router，不监听端口。
tower = { version = "0.5", features = ["util"] }

# ---- 本地开发快档（只影响 `cargo build` 默认档与 `cargo test`）----
# 目的：让本机迭代尽量快，同时避免依赖随 profile 切换反复重编。
# 注意：发版、性能/内存测量一律用 release 档，dev 档数据不作结论。
[profile.dev]
opt-level = 0          # 本 crate 保持低优化，改一行只重编一个 crate
debug = false          # 不生成调试信息：编译/链接更快、target 更小
incremental = true

# 依赖按 opt-level=2 编一次后长期缓存；本 crate 仍走上面的 dev 设置
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"      # 体积/内存优先
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"    # 剥掉符号表：aarch64 已由 zig 剥过，x86_64/msvc 需要显式声明
