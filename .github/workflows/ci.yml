name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# 工具链版本只由仓库根 `rust-toolchain.toml` 决定（当前固定 1.96.0，含 rustfmt/clippy
# 与 aarch64-unknown-linux-musl 目标）。runner 上没有该版本时，第一个 cargo 步骤会自动
# 按版本安装（实测 ~20-30s，见 docs/BUILD.md §2.3）；本机已装则无额外开销。
# 不要换成 `dtolnay/rust-toolchain@stable` 之类：会绕过仓库级固定，重新引入
# 「本机绿、云端红」的漂移（v0.3.10 起 clippy 1.99 新 lint 曾让 check 全线变红）。

jobs:
  # ------------------------------------------------------------------ 
  # Rust：fmt / clippy / test，全部 debug 构建。
  # release（opt-level=z + fat LTO）只在 tag / 手动触发的平台 job 跑，
  # 避免每次 push 都付出数分钟链接成本。
  # ------------------------------------------------------------------
  rust:
    name: rust check + test (linux x86_64, debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (linux-gnu)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: linux-gnu

      # 代码洁净度门禁：格式化与 clippy 全部零容忍（-D warnings）。
      # 版本严格跟随 rust-toolchain.toml：不要用 `cargo +stable` 或
      # 升级 runner 默认工具链，否则 clippy 的 lint 集合会与本地分叉。
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # ------------------------------------------------------------------
  # 前端：单测 + 构建 + Svelte 检查 + 首屏体积门禁。
  # ------------------------------------------------------------------
  web:
    name: frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Svelte 类型/模板检查：0 error 才通过（现存 a11y 类 warning 不阻断）。
      - name: Svelte check
        run: npm run check

      # 首屏体积门禁：口径 = 入口 chunk + 其静态 import 的 chunk（gzip），
      # 不是 dist/*.js 总量。阈值在 scripts/budget.json；
      # 脚本在仓库根目录，需显式把工作目录切回根。
      - name: Budget gate (frontend)
        working-directory: .
        run: node scripts/check-budget.mjs --frontend-only

  # ------------------------------------------------------------------
  # /k 墨水屏样式门禁：扫描 kindle.rs 与 kindle/ 子模块，排除 selftest。
  # ------------------------------------------------------------------
  eink:
    name: eink css gate (/k)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Eink CSS gate
        run: node scripts/eink-lint.mjs

  # ------------------------------------------------------------------
  # 迁移字节门禁：索引/工作区全 LF，且工作区字节与索引 blob 完全一致。
  # 内嵌字节（sqlx::migrate! 的 include_str!）由 cargo test 中的
  # tests/migrations_lf.rs 断言。
  # ------------------------------------------------------------------
  migrations:
    name: migrations LF gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Migrations LF gate
        run: |
          set -euo pipefail
          bad_eol=$(git ls-files --eol server/migrations | grep -c 'crlf' || true)
          if [ "$bad_eol" -ne 0 ]; then
            echo "::error::$bad_eol 个迁移文件在索引或工作区是 CRLF"
            git ls-files --eol server/migrations | grep 'crlf' || true
            exit 1
          fi
          for f in $(git ls-files server/migrations | grep '\.sql$'); do
            cr=$(grep -c $'\r' "$f" || true)
            if [ "$cr" -ne 0 ]; then
              echo "::error::$f 有 $cr 行含 CR"
              exit 1
            fi
            git show ":$f" | cmp -s - "$f" || {
              echo "::error::$f 工作区字节与索引 blob 不一致"
              exit 1
            }
          done
          echo "migrations LF gate: PASS"

  # ------------------------------------------------------------------
  # tag v* / 手动触发：三平台产物
  # ------------------------------------------------------------------
  windows:
    name: build (windows x86_64 msvc)
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      # 防回归：checkout 落到磁盘的换行必须与 .gitattributes 一致。
      # 若出现 i/crlf 或 w/crlf，sqlx::migrate! 就会把 CRLF 字节内嵌进 Windows 产物，
      # 导致与 Linux/仓库的 LF 校验和不一致（v0.3.1 事故：0003 len 414 vs 410）。
      - name: Assert migrations are LF
        shell: pwsh
        run: |
          $out = git -C "$env:GITHUB_WORKSPACE" ls-files --eol server/migrations
          $out
          $bad = $out | Select-String -Pattern 'i/crlf|w/crlf'
          if ($bad) {
            Write-Error "server/migrations 出现 CRLF（.gitattributes 未生效）：`n$($bad -join "`n")"
            exit 1
          }

      - name: Cache cargo (windows-msvc)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: windows-msvc

      - name: cargo build --release
        run: cargo build --release --locked

      # 核心证据：打出 Windows 侧 sqlx::migrate! 内嵌的每条迁移字节数（0003 必须是 410）。
      - name: cargo test (migrations LF)
        run: cargo test --locked --test migrations_lf -- --nocapture

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/boranlib.exe dist/boranlib-windows-x86_64.exe
          $hash = (Get-FileHash dist/boranlib-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  boranlib-windows-x86_64.exe" | Set-Content -Encoding ascii dist/boranlib-windows-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: boranlib-windows-x86_64
          path: |
            server/dist/boranlib-windows-x86_64.exe
            server/dist/boranlib-windows-x86_64.sha256
          if-no-files-found: error

  linux-x64:
    name: build (linux x86_64 musl)
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (x86_64-musl)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: x86_64-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: cargo build --release (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify static ELF + package
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/boranlib
          test -f "$BIN"
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::$BIN 不是静态 ELF（存在 PT_INTERP）"
            exit 1
          fi
          readelf -h "$BIN" | grep Machine
          mkdir -p dist
          cp "$BIN" dist/boranlib-linux-x86_64
          sha256sum dist/boranlib-linux-x86_64 | sed 's#  dist/#  #' > dist/boranlib-linux-x86_64.sha256
          cat dist/boranlib-linux-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: boranlib-linux-x86_64
          path: |
            server/dist/boranlib-linux-x86_64
            server/dist/boranlib-linux-x86_64.sha256
          if-no-files-found: error

  linux-arm64:
    name: build (linux aarch64 musl / OpenStick)
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (aarch64-musl)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: aarch64-musl

      - name: Add rust target
        run: rustup target add aarch64-unknown-linux-musl

      # aarch64-unknown-linux-musl 没有现成的 musl 交叉 gcc（musl-tools 只提供
      # x86_64 的 musl-gcc），依赖里的 C 代码（libsqlite3-sys）必须有可用的交叉
      # 编译器；Zig 在这里是必需项，不是偏好。
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.13.0'

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild --release (aarch64 musl)
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Verify static ELF + package
        run: |
          set -euo pipefail
          BIN=target/aarch64-unknown-linux-musl/release/boranlib
          test -f "$BIN"
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::$BIN 不是静态 ELF（存在 PT_INTERP）"
            exit 1
          fi
          readelf -h "$BIN" | grep Machine
          mkdir -p dist
          cp "$BIN" dist/boranlib-linux-aarch64
          sha256sum dist/boranlib-linux-aarch64 | sed 's#  dist/#  #' > dist/boranlib-linux-aarch64.sha256
          cat dist/boranlib-linux-aarch64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: boranlib-linux-aarch64
          path: |
            server/dist/boranlib-linux-aarch64
            server/dist/boranlib-linux-aarch64.sha256
          if-no-files-found: error

  # ------------------------------------------------------------------
  # tag v* / 手动触发：产物体积门禁。超限直接失败并把 Release 一起拦住，
  # 避免"发版了才发现包变大"。
  # ------------------------------------------------------------------
  budget:
    name: budget
    needs: [rust, web, eink, migrations, windows, linux-x64, linux-arm64]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Binary budget (strict)
        run: |
          ls -l artifacts
          node scripts/check-budget.mjs --binaries-only --strict

  # ------------------------------------------------------------------
  # 仅 v* tag：汇总三平台产物 + 校验清单，创建 Release
  # ------------------------------------------------------------------
  release:
    name: release
    needs: [rust, web, eink, migrations, budget, windows, linux-x64, linux-arm64]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build checksum manifest
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum boranlib-windows-x86_64.exe boranlib-linux-x86_64 boranlib-linux-aarch64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/boranlib-windows-x86_64.exe
            dist/boranlib-linux-x86_64
            dist/boranlib-linux-aarch64
            dist/SHA256SUMS.txt
          body: |
            版本 ${{ github.ref_name }}

            Linux 两个包均为静态 musl 二进制（无 PT_INTERP 依赖），其中 `boranlib-linux-aarch64` 适用于 OpenStick。
            Windows 包为 x86_64 msvc 构建。

            校验：`sha256sum -c SHA256SUMS.txt`

            ## 搜索

            - 聚合搜索引入**源级并发槽 + 全局 deadline**：等槽位的时间不再吃掉单源预算，慢源不会再拖垮整轮聚合。
            - `enabled` 以数据库列为准，停用的源不再进入聚合搜索（修复"停用源仍被搜"）。

            ## 规则引擎

            - 多行规则**逐行求值**：修复快看/爱看等站点 `book_url` 被拼成整段 JSON 的问题。
            - `searchUrl` 支持 `{{encodeURIComponent(key)}}`、`{{page*N}}` 模板。
            - CSS/文本取值语义对齐上游：单值规则合并多结果、`<tr>` 片段保留表格上下文、多值按行合并、`class` 首段、尾部 `.N` 下标、`@text` 块间空格等（F1/F2/F6）。

            ## 图像

            - 墨水屏转码默认 **1200 宽 / q70**；JPEG 源在墨水屏模式下也走灰度重编码。
            - 新增 **8 MP 解码像素上限**（`MAX_TRANSCODE_PIXELS`），源图超限直接拒绝，防解压炸弹。
            - `BORANLIB_EINK_JPEG_WIDTH` / `BORANLIB_EINK_ADAPTIVE` / `BORANLIB_EINK_USM` 见 `docs/BUILD.md` 环境变量表。

            ## 迁移

            - 沿用 v0.3.3 的 CRLF→LF 校验和归一化：旧库首次启动会**先备份**（`VACUUM INTO`，路径在启动日志里）再做一次归一化，仅当差异只有换行且记录 `success=1`；内容真不一致仍拒绝启动。
            - 可用 `BORANLIB_MIGRATION_REPAIR=off` 关闭（只报错、不改库）。

            ## 已知问题

            - `@put/@get`、JS `cache`、`java.base64Decode` 尚未实现，部分漫画源的取图规则仍会失败。
            - 设备侧外网较慢时，仍可能出现较多单源超时（并发槽降低了相互影响，但不消除源站本身慢）。
