name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 校验与测试：分支 push / PR / tag 全部必跑。
  # tag 也跑是为了让 Release 建立在「测试已通过」之上，而不是只有分支才测。
  # ------------------------------------------------------------------
  check:
    name: check + test (linux x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (linux-gnu)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      # 前端先构建：ServeDir 是运行期相对路径（web/dist），不在编译期内嵌，
      # 但保持「先出 dist 再编 Rust」的现场顺序，便于排查。
      - name: Install frontend deps
        working-directory: server/web
        run: npm ci

      - name: Build frontend
        working-directory: server/web
        run: npm run build

      # 首屏体积门禁：口径 = 入口 chunk + 其静态 import 的 chunk（gzip），
      # 不是 dist/*.js 总量。阈值在 scripts/budget.json。
      # 脚本与 budget.json 在仓库根目录的 scripts/，必须显式覆盖 job 级的 server/。
      - name: Budget gate (frontend)
        working-directory: .
        run: node scripts/check-budget.mjs --frontend-only

      # 迁移字节门禁（构建前）：索引/工作区全 LF，且工作区字节与索引 blob 完全一致。
      # 内嵌字节（sqlx::migrate! 的 include_str!）由 tests/migrations_lf.rs 在 cargo test 中断言。
      - name: Migrations LF gate
        working-directory: .
        run: |
          set -euo pipefail
          bad_eol=$(git ls-files --eol server/migrations | grep -c 'crlf' || true)
          if [ "$bad_eol" -ne 0 ]; then
            echo "::error::$bad_eol 个迁移文件在索引或工作区是 CRLF"
            git ls-files --eol server/migrations | grep 'crlf' || true
            exit 1
          fi
          for f in $(git ls-files server/migrations | grep '\.sql$'); do
            cr=$(grep -c $'\r' "$f" || true)
            if [ "$cr" -ne 0 ]; then
              echo "::error::$f 有 $cr 行含 CR"
              exit 1
            fi
            git show ":$f" | cmp -s - "$f" || {
              echo "::error::$f 工作区字节与索引 blob 不一致"
              exit 1
            }
          done
          echo "migrations LF gate: PASS"

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --locked

  # ------------------------------------------------------------------
  # tag v* / 手动触发：三平台产物
  # ------------------------------------------------------------------
  windows:
    name: build (windows x86_64 msvc)
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      # 防回归：checkout 落到磁盘的换行必须与 .gitattributes 一致。
      # 若出现 i/crlf 或 w/crlf，sqlx::migrate! 就会把 CRLF 字节内嵌进 Windows 产物，
      # 导致与 Linux/仓库的 LF 校验和不一致（v0.3.1 事故：0003 len 414 vs 410）。
      - name: Assert migrations are LF
        shell: pwsh
        run: |
          $out = git -C "$env:GITHUB_WORKSPACE" ls-files --eol server/migrations
          $out
          $bad = $out | Select-String -Pattern 'i/crlf|w/crlf'
          if ($bad) {
            Write-Error "server/migrations 出现 CRLF（.gitattributes 未生效）：`n$($bad -join "`n")"
            exit 1
          }

      - name: Cache cargo (windows-msvc)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: windows-msvc

      - name: cargo build --release
        run: cargo build --release --locked

      # 核心证据：打出 Windows 侧 sqlx::migrate! 内嵌的每条迁移字节数（0003 必须是 410）。
      - name: cargo test (migrations LF)
        run: cargo test --locked --test migrations_lf -- --nocapture

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/boranlib.exe dist/boranlib-windows-x86_64.exe
          $hash = (Get-FileHash dist/boranlib-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  boranlib-windows-x86_64.exe" | Set-Content -Encoding ascii dist/boranlib-windows-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: boranlib-windows-x86_64
          path: |
            server/dist/boranlib-windows-x86_64.exe
            server/dist/boranlib-windows-x86_64.sha256
          if-no-files-found: error

  linux-x64:
    name: build (linux x86_64 musl)
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (x86_64-musl)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: x86_64-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: cargo build --release (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify static ELF + package
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/boranlib
          test -f "$BIN"
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::$BIN 不是静态 ELF（存在 PT_INTERP）"
            exit 1
          fi
          readelf -h "$BIN" | grep Machine
          mkdir -p dist
          cp "$BIN" dist/boranlib-linux-x86_64
          sha256sum dist/boranlib-linux-x86_64 | sed 's#  dist/#  #' > dist/boranlib-linux-x86_64.sha256
          cat dist/boranlib-linux-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: boranlib-linux-x86_64
          path: |
            server/dist/boranlib-linux-x86_64
            server/dist/boranlib-linux-x86_64.sha256
          if-no-files-found: error

  linux-arm64:
    name: build (linux aarch64 musl / OpenStick)
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (aarch64-musl)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: aarch64-musl

      - name: Add rust target
        run: rustup target add aarch64-unknown-linux-musl

      # aarch64-unknown-linux-musl 没有现成的 musl 交叉 gcc（musl-tools 只提供
      # x86_64 的 musl-gcc），依赖里的 C 代码（libsqlite3-sys）必须有可用的交叉
      # 编译器；Zig 在这里是必需项，不是偏好。
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.13.0'

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild --release (aarch64 musl)
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Verify static ELF + package
        run: |
          set -euo pipefail
          BIN=target/aarch64-unknown-linux-musl/release/boranlib
          test -f "$BIN"
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::$BIN 不是静态 ELF（存在 PT_INTERP）"
            exit 1
          fi
          readelf -h "$BIN" | grep Machine
          mkdir -p dist
          cp "$BIN" dist/boranlib-linux-aarch64
          sha256sum dist/boranlib-linux-aarch64 | sed 's#  dist/#  #' > dist/boranlib-linux-aarch64.sha256
          cat dist/boranlib-linux-aarch64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: boranlib-linux-aarch64
          path: |
            server/dist/boranlib-linux-aarch64
            server/dist/boranlib-linux-aarch64.sha256
          if-no-files-found: error

  # ------------------------------------------------------------------
  # tag v* / 手动触发：产物体积门禁。超限直接失败并把 Release 一起拦住，
  # 避免"发版了才发现包变大"。
  # ------------------------------------------------------------------
  budget:
    name: budget
    needs: [check, windows, linux-x64, linux-arm64]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Binary budget (strict)
        run: |
          ls -l artifacts
          node scripts/check-budget.mjs --binaries-only --strict

  # ------------------------------------------------------------------
  # 仅 v* tag：汇总三平台产物 + 校验清单，创建 Release
  # ------------------------------------------------------------------
  release:
    name: release
    needs: [check, budget, windows, linux-x64, linux-arm64]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build checksum manifest
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum boranlib-windows-x86_64.exe boranlib-linux-x86_64 boranlib-linux-aarch64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/boranlib-windows-x86_64.exe
            dist/boranlib-linux-x86_64
            dist/boranlib-linux-aarch64
            dist/SHA256SUMS.txt
          body: |
            版本 ${{ github.ref_name }}

            Linux 两个包均为静态 musl 二进制（无 PT_INTERP 依赖），其中 `boranlib-linux-aarch64` 适用于 OpenStick。
            Windows 包为 x86_64 msvc 构建。

            校验：`sha256sum -c SHA256SUMS.txt`

            ## 升级说明（重要）

            1. 旧库首次启动会做一次迁移校验和归一化（仅当差异只有换行、即 CRLF↔LF，且记录 `success=1`）：
               **会先备份**（`VACUUM INTO`），备份路径写在启动日志里，失败可从 `data/backups` 恢复。
            2. `v0.3.1` 的 Windows 包与已撤回的 `v0.3.2` 均不可用，请直接使用本版。
            3. 若归一化后仍报 `VersionMismatch`，说明迁移内容真的不一致，需要人工处理（不会被自动掩盖）。

            归一化可用 `BORANLIB_MIGRATION_REPAIR=off` 关闭（关闭后只报错、不修改任何记录）。
